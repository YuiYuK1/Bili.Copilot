name: Build Sideload Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0.0)"
        required: true
        default: "1.0.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64, arm64]

    env:
      Solution_Name: src/Bili.Copilot.sln
      Project_Path: src/Desktop/BiliCopilot.UI/BiliCopilot.UI.csproj
      Manifest_Path: src/Desktop/BiliCopilot.UI/Package.appxmanifest
      Configuration: ${{ matrix.configuration }}
      Platform: ${{ matrix.platform }}
      Cert_Subject: CN=Kokoro.BiliCopilot
      Cert_Password: BiliCopilot123

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          version: ${{ inputs.version }}
          sideload: "true"
          platform: ${{ env.Platform }}
          configuration: ${{ env.Configuration }}
          solution-name: ${{ env.Solution_Name }}
          manifest-path: ${{ env.Manifest_Path }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sideload certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:GITHUB_WORKSPACE "src\Desktop\BiliCopilot.UI\BiliCopilot.UI_TemporaryKey.pfx"
          $cer = Join-Path $env:GITHUB_WORKSPACE "src\Desktop\BiliCopilot.UI\BiliCopilot.UI_TemporaryKey.cer"
          $password = ConvertTo-SecureString $env:Cert_Password -Force -AsPlainText
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $env:Cert_Subject `
            -FriendlyName "BiliCopilot Sideload" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(2)
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password -Force | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer -Force | Out-Null

      - name: Build
        shell: pwsh
        run: |
          msbuild $env:Project_Path `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:SolutionDir="$env:GITHUB_WORKSPACE\src\" `
            /p:GenerateAppxPackageOnBuild=false
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package
        shell: pwsh
        run: |
          $pfx = Join-Path $env:GITHUB_WORKSPACE "src\Desktop\BiliCopilot.UI\BiliCopilot.UI_TemporaryKey.pfx"
          msbuild $env:Project_Path `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /p:SolutionDir="$env:GITHUB_WORKSPACE\src\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:BuildProjectReferences=false `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$pfx" `
            /p:PackageCertificatePassword="$env:Cert_Password" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppPackages\"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appPackages = Join-Path $env:GITHUB_WORKSPACE "AppPackages"
          $staging = Join-Path $env:GITHUB_WORKSPACE "Artifacts\staging"
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "Artifacts"

          if (Test-Path $staging) {
            Remove-Item $staging -Recurse -Force
          }

          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path $artifacts -Force | Out-Null

          $packages = @()
          $packages += Get-ChildItem -Path $appPackages -Recurse -File -Filter *.msix -ErrorAction SilentlyContinue
          $packages += Get-ChildItem -Path $appPackages -Recurse -File -Filter *.cer -ErrorAction SilentlyContinue
          foreach ($package in $packages) {
            Copy-Item $package.FullName -Destination $staging -Force
          }

          $cer = Join-Path $env:GITHUB_WORKSPACE "src\Desktop\BiliCopilot.UI\BiliCopilot.UI_TemporaryKey.cer"
          if (Test-Path $cer) {
            Copy-Item $cer -Destination $staging -Force
          }

          Copy-Item "docs/sideload-guide.txt" -Destination (Join-Path $staging "安装说明.txt") -Force
          Copy-Item "scripts/Install.ps1" -Destination (Join-Path $staging "Install.ps1") -Force

          $zip = Join-Path $artifacts "BiliCopilot_${{ inputs.version }}_$env:Platform.zip"
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zip -Force
          Get-ChildItem $staging | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliCopilot-Sideload-${{ inputs.version }}-${{ matrix.platform }}
          path: Artifacts/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BiliCopilot-Sideload-${{ inputs.version }}-*
          path: release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          prerelease: true
          files: release/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
